{% extends "base.html" %}
{% block title %}Payroll - View{% endblock %}

{% block content %}
  <h2>Employee record</h2>

  <p><strong>ID:</strong> {{ employee["id"] }}</p>
  <p><strong>Name:</strong> {{ employee["name"] }}</p>
  <p><strong>Salary:</strong> {{ format_gbp(employee["salary_gbp_pence"]) }}</p>

  <div class="actions" style="margin-top: 1rem;">
    <a class="btn" href="{{ url_for('edit_employee', emp_id=employee['id']) }}">Edit</a>

    <form method="post" action="{{ url_for('delete_employee', emp_id=employee['id']) }}"
          onsubmit="return confirm('Delete this record?');">
      <button class="btn danger" type="submit">Delete</button>
    </form>

    <a class="btn" href="{{ url_for('index') }}">Back</a>
  </div>
{% endblock %}
