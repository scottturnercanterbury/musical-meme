<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Payroll{% endblock %}</title>
    <style>
      body { font-family: system-ui, Arial, sans-serif; margin: 2rem; max-width: 900px; }
      header { display: flex; justify-content: space-between; align-items: baseline; }
      a { text-decoration: none; }
      nav a { margin-right: 1rem; }
      table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      th, td { padding: 0.6rem; border-bottom: 1px solid #ddd; text-align: left; }
      .btn { display: inline-block; padding: 0.4rem 0.7rem; border: 1px solid #333; border-radius: 6px; background: #fff; cursor: pointer; }
      .btn.danger { border-color: #a00; color: #a00; }
      .flash { padding: 0.8rem; border-radius: 6px; margin: 1rem 0; }
      .flash.success { background: #e7f7ea; border: 1px solid #8bd19a; }
      .flash.error { background: #fdeaea; border: 1px solid #f2a3a3; }
      form label { display: block; margin-top: 0.8rem; }
      input[type="text"] { width: 100%; padding: 0.5rem; box-sizing: border-box; }
      .row { display: flex; gap: 1rem; align-items: center; }
      .row > * { flex: 1; }
      footer { margin-top: 2rem; color: #666; font-size: 0.9rem; }
      .actions { display:flex; gap: .5rem; align-items:center; }
    </style>
  </head>
  <body>
    <header>
      <h1>Payroll Management</h1>
      <nav>
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('add_employee') }}">Add employee</a>
      </nav>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <footer>
      <p>Simple Flask + SQLite payroll demo.</p>
    </footer>
  </body>
</html>
