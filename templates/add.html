{% extends "base.html" %}
{% block title %}Payroll - Add{% endblock %}

{% block content %}
  <h2>Add employee</h2>

  <form method="post">
    <label>
      Name
      <input type="text" name="name" value="{{ name }}" placeholder="e.g., Alex Smith" required />
    </label>

    <label>
      Salary (GBP)
      <input type="text" name="salary" value="{{ salary }}" placeholder="e.g., 35000 or 35000.00" required />
    </label>

    <div style="margin-top: 1rem;">
      <button class="btn" type="submit">Save</button>
      <a class="btn" href="{{ url_for('index') }}">Cancel</a>
    </div>
  </form>
{% endblock %}
